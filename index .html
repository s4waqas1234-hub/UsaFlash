<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProTrade Global | Live Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Aapka Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAySRA1YSpTpmC8WjnKmDhnNMHkEmkeP50",
            authDomain: "waqas-47f30.firebaseapp.com",
            projectId: "waqas-47f30",
            storageBucket: "waqas-47f30.firebasestorage.app",
            messagingSenderId: "1046641935409",
            appId: "1:1046641935409:web:a28b245501963f71714110",
            measurementId: "G-MQ77HZRHMS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Global User State
        window.user = null;

        // AUTH FUNCTIONS
        window.handleRegister = async () => {
            const e = document.getElementById('regEmail').value;
            const p = document.getElementById('regPass').value;
            if(!e || !p) return alert("Enter all details");
            try {
                const res = await createUserWithEmailAndPassword(auth, e, p);
                await setDoc(doc(db, "users", res.user.uid), {
                    email: e,
                    balance: 0.00,
                    tid: Math.floor(100000 + Math.random() * 900000),
                    status: "active",
                    joinedAt: new Date()
                });
                alert("Account Created Successfully!");
                location.reload();
            } catch (err) { alert(err.message); }
        };

        window.handleLogin = async () => {
            const e = document.getElementById('logEmail').value;
            const p = document.getElementById('logPass').value;
            try {
                await signInWithEmailAndPassword(auth, e, p);
            } catch (err) { alert("Invalid Login Details"); }
        };

        window.logout = () => signOut(auth);

        // DATA SYNC (Real-time)
        onAuthStateChanged(auth, (authUser) => {
            if (authUser) {
                onSnapshot(doc(db, "users", authUser.uid), (snap) => {
                    if (snap.exists()) {
                        window.user = snap.data();
                        if(window.user.status === "blocked") {
                            alert("Account Blocked!");
                            signOut(auth);
                            return;
                        }
                        // UI Updates
                        document.getElementById('authWrapper').style.display = 'none';
                        document.getElementById('mainBalance').innerText = "$" + window.user.balance.toFixed(2);
                        document.getElementById('drawEmail').innerText = window.user.email;
                        document.getElementById('drawID').innerText = "TRADER ID: " + window.user.tid;
                        document.getElementById('drawIco').innerText = window.user.email[0].toUpperCase();
                    }
                });
            } else {
                document.getElementById('authWrapper').style.display = 'flex';
            }
        });

        // DEPOSIT & WITHDRAW REQUESTS
        window.finalDepSubmit = async () => {
            const txid = document.getElementById('dTx').value;
            if(!txid) return alert("Enter TXID");
            await addDoc(collection(db, "requests"), {
                uid: auth.currentUser.uid,
                email: window.user.email,
                type: "Deposit",
                amount: "Pending Admin Check",
                txid: txid,
                status: "pending",
                timestamp: new Date()
            });
            alert("Deposit submitted! Admin will check TXID.");
            closeModal('depModal');
        };

        window.executeWithdraw = async () => {
            const amt = parseFloat(document.getElementById('wAmt').value);
            if(amt >= 20 && amt <= window.user.balance) {
                await addDoc(collection(db, "requests"), {
                    uid: auth.currentUser.uid,
                    email: window.user.email,
                    type: "Withdraw",
                    amount: amt,
                    status: "pending",
                    timestamp: new Date()
                });
                alert("Withdrawal Requested!");
                closeModal('witModal');
            } else { alert("Min $20 and max your balance only."); }
        };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #0b0e14; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; height: 100dvh; margin: 0; }
        
        #authWrapper { position: fixed; inset: 0; z-index: 9999; background: #0b0e14; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #1c222d; border: 1px solid rgba(255,255,255,0.08); width: 100%; max-width: 360px; border-radius: 24px; padding: 24px; }
        .input-box { border: 1px solid #3d4452; border-radius: 12px; padding: 12px; background: transparent; width: 100%; color: white; margin-bottom: 12px; outline: none; }
        
        .tab-btn { padding: 10px; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .active-tab { background: #3b82f6; color: white; }
        
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: #1c222d; border-radius: 24px; padding: 24px; width: 100%; max-width: 400px; }
        
        #sideDrawer { position: fixed; top: 0; right: -300px; width: 280px; height: 100%; background: #161b22; z-index: 2000; transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1); padding: 30px 20px; }
        #sideDrawer.active { right: 0; }
    </style>
</head>
<body>

    <div id="authWrapper">
        <div class="auth-card" id="loginBox">
            <h2 class="text-2xl font-extrabold mb-6">ProTrade Global</h2>
            <input type="email" id="logEmail" class="input-box" placeholder="Email">
            <input type="password" id="logPass" class="input-box" placeholder="Password">
            <button onclick="handleLogin()" class="bg-blue-600 w-100 py-3 rounded-xl font-bold w-full">Sign In</button>
            <p class="mt-4 text-center text-sm">New here? <span class="text-blue-400" onclick="document.getElementById('loginBox').style.display='none'; document.getElementById('registerBox').style.display='block';">Create Account</span></p>
        </div>
        <div class="auth-card" id="registerBox" style="display:none;">
            <h2 class="text-2xl font-extrabold mb-6">Join ProTrade</h2>
            <input type="email" id="regEmail" class="input-box" placeholder="Email">
            <input type="password" id="regPass" class="input-box" placeholder="Password">
            <button onclick="handleRegister()" class="bg-blue-600 w-100 py-3 rounded-xl font-bold w-full">Create Account</button>
            <p class="mt-4 text-center text-sm">Have account? <span class="text-blue-400" onclick="document.getElementById('registerBox').style.display='none'; document.getElementById('loginBox').style.display='block';">Login</span></p>
        </div>
    </div>

    <div class="p-6 h-full flex flex-col">
        <div class="flex justify-between items-center mb-6">
            <div>
                <p class="text-gray-400 text-xs font-bold uppercase tracking-widest">Available Balance</p>
                <h1 id="mainBalance" class="text-4xl font-extrabold text-white tracking-tighter">$0.00</h1>
            </div>
            <button onclick="openDrawer()" class="bg-gray-800 p-3 rounded-2xl">Menu</button>
        </div>

        <div class="flex-1 bg-gray-900/50 border border-white/5 rounded-3xl mb-6 relative overflow-hidden p-4">
             <p class="text-blue-400 font-bold text-xs uppercase">BTC/USDT Live</p>
             <div class="mt-20 text-center text-gray-600">[ Trading Chart Interface ]</div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
            <button onclick="openModal('depModal')" class="bg-blue-600 p-5 rounded-2xl font-extrabold shadow-lg shadow-blue-900/20">DEPOSIT</button>
            <button onclick="openModal('witModal')" class="bg-white/10 border border-white/10 p-5 rounded-2xl font-extrabold">WITHDRAW</button>
        </div>
    </div>

    <div id="sideDrawer">
        <div class="flex flex-col items-center mb-10">
            <div id="drawIco" class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center text-2xl font-bold mb-3">U</div>
            <p id="drawEmail" class="font-bold">User Email</p>
            <p id="drawID" class="text-xs text-gray-500">ID: 000000</p>
        </div>
        <button onclick="logout()" class="w-full bg-red-500/10 text-red-500 p-4 rounded-2xl font-bold mt-10">Sign Out</button>
        <button onclick="closeDrawer()" class="w-full mt-4 text-gray-500">Close</button>
    </div>

    <div class="modal" id="depModal">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-4">Deposit Funds</h3>
            <p class="text-sm text-gray-400 mb-2">Send USDT (TRC20) to:</p>
            <div class="bg-black/40 p-3 rounded-xl text-xs font-mono mb-4 break-all border border-white/5">
                TAaTmYha48Pbft4aJn1RGyKmVoQZKuLArM
            </div>
            <input type="text" id="dTx" class="input-box" placeholder="Enter Transaction ID (TXID)">
            <button onclick="finalDepSubmit()" class="bg-blue-600 w-full py-3 rounded-xl font-bold">Submit Request</button>
            <button onclick="closeModal('depModal')" class="w-full mt-3 text-gray-500">Cancel</button>
        </div>
    </div>

    <div class="modal" id="witModal">
        <div class="modal-content">
            <h3 class="text-xl font-bold mb-4">Withdraw</h3>
            <input type="number" id="wAmt" class="input-box" placeholder="Amount ($)">
            <input type="text" class="input-box" placeholder="TRC20 Wallet Address">
            <button onclick="executeWithdraw()" class="bg-white text-black w-full py-3 rounded-xl font-bold">Withdraw Now</button>
            <button onclick="closeModal('witModal')" class="w-full mt-3 text-gray-500">Cancel</button>
        </div>
    </div>

    <script>
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function openDrawer() { document.getElementById('sideDrawer').classList.add('active'); }
        function closeDrawer() { document.getElementById('sideDrawer').classList.remove('active'); }
    </script>
</body>
</html>

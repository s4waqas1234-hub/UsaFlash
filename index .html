<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProTrade Global | Final Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAySRA1YSpTpmC8WjnKmDhnNMHkEmkeP50",
            authDomain: "waqas-47f30.firebaseapp.com",
            projectId: "waqas-47f30",
            storageBucket: "waqas-47f30.firebasestorage.app",
            messagingSenderId: "1046641935409",
            appId: "1:1046641935409:web:a28b245501963f71714110",
            measurementId: "G-MQ77HZRHMS"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.currentUserData = null;

        // --- Auth Logic ---
        window.executeAuth = async () => {
            const email = document.getElementById('authEmail').value;
            const pass = document.getElementById('authPass').value;
            const mode = document.getElementById('tabLogin').classList.contains('active') ? 'login' : 'reg';

            try {
                if (mode === 'reg') {
                    const res = await createUserWithEmailAndPassword(auth, email, pass);
                    await setDoc(doc(db, "users", res.user.uid), {
                        email: email,
                        balance: 0.00,
                        tid: Math.floor(100000 + Math.random() * 900000),
                        status: "active",
                        country: document.getElementById('authCountry').value
                    });
                } else {
                    await signInWithEmailAndPassword(auth, email, pass);
                }
            } catch (err) {
                alert("Auth Error: " + err.message);
            }
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                onSnapshot(doc(db, "users", user.uid), (snap) => {
                    if (snap.exists()) {
                        window.currentUserData = snap.data();
                        updateUI();
                        document.getElementById('authWrapper').style.display = 'none';
                        document.getElementById('mainTerminal').style.display = 'flex';
                    }
                });
            } else {
                document.getElementById('authWrapper').style.display = 'flex';
                document.getElementById('mainTerminal').style.display = 'none';
            }
        });

        function updateUI() {
            document.getElementById('balanceText').innerText = "$" + window.currentUserData.balance.toFixed(2);
            document.getElementById('profileIco').innerText = window.currentUserData.email[0].toUpperCase();
            if(document.getElementById('drawEmail')) {
                document.getElementById('drawEmail').innerText = window.currentUserData.email;
                document.getElementById('drawID').innerText = "TRADER ID: " + window.currentUserData.tid;
                document.getElementById('drawIco').innerText = window.currentUserData.email[0].toUpperCase();
            }
        }

        // --- Deposit/Withdraw Logic ---
        window.finalDepSubmit = async () => {
            const tx = document.getElementById('dTx').value;
            if(!tx) return alert("Please enter TXID");
            await addDoc(collection(db, "requests"), {
                uid: auth.currentUser.uid,
                email: window.currentUserData.email,
                type: "Deposit",
                txid: tx,
                status: "pending",
                time: new Date()
            });
            alert("Deposit submitted for approval!");
            closeModal('depModal');
        };

        window.executeWithdraw = async () => {
            const amt = parseFloat(document.getElementById('wAmt').value);
            if(amt >= 20 && amt <= window.currentUserData.balance) {
                await addDoc(collection(db, "requests"), {
                    uid: auth.currentUser.uid,
                    email: window.currentUserData.email,
                    type: "Withdraw",
                    amount: amt,
                    status: "pending",
                    time: new Date()
                });
                alert("Withdrawal request sent!");
                closeModal('witModal');
            } else {
                alert("Min withdraw $20 or insufficient balance!");
            }
        };

        window.logout = () => signOut(auth);
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #0b0e14; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; height: 100dvh; margin: 0; }
        #authWrapper { position: fixed; inset: 0; z-index: 9999; background: #0b0e14; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #1c222d; border: 1px solid rgba(255,255,255,0.08); width: 100%; max-width: 360px; border-radius: 24px; padding: 24px; }
        .input-box { position: relative; border: 1px solid #3d4452; border-radius: 12px; padding: 12px; background: transparent; margin-bottom: 16px; }
        .input-box label { position: absolute; top: -10px; left: 12px; background: #1c222d; padding: 0 5px; font-size: 11px; color: #848e9c; font-weight: 600; }
        .input-box input, .input-box select { background: transparent; border: none; width: 100%; color: white; outline: none; font-size: 14px; }
        .tab-btn { flex: 1; padding: 10px; font-size: 12px; font-weight: 700; border-radius: 10px; color: #848e9c; }
        .tab-btn.active { background: #3d4452; color: white; }
        #mainTerminal { display: none; height: 100dvh; flex-direction: column; padding: 8px; }
        .ui-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 11000; align-items: center; justify-content: center; padding: 20px; }
        #sideDrawer { position: fixed; top: 0; left: -100%; width: 280px; height: 100%; background: #1c222d; z-index: 10000; transition: 0.4s; }
        #sideDrawer.active { left: 0; }
        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 9000; }
    </style>
</head>
<body>

    <div id="authWrapper">
        <div class="auth-card">
            <div class="flex bg-[#0b0e14] p-1 rounded-xl mb-6">
                <button id="tabLogin" onclick="setAuthMode('login')" class="tab-btn active">LOG IN</button>
                <button id="tabReg" onclick="setAuthMode('reg')" class="tab-btn">SIGN UP</button>
            </div>
            <div id="regFields" class="hidden">
                <div class="input-box"><label>Country</label><select id="authCountry"><option>India</option><option>Pakistan</option><option>UAE</option></select></div>
            </div>
            <div class="input-box"><label>Email</label><input type="email" id="authEmail" placeholder="Enter email"></div>
            <div class="input-box"><label>Password</label><input type="password" id="authPass" placeholder="••••••••"></div>
            <button onclick="executeAuth()" id="authSubmitBtn" class="w-full py-4 bg-yellow-500 text-black font-black rounded-xl uppercase text-xs">Login ➔</button>
        </div>
    </div>

    <div id="mainTerminal">
        <header class="flex justify-between items-center mb-3 px-1">
            <div class="flex items-center gap-3" onclick="openDrawer()">
                <div id="profileIco" class="w-10 h-10 rounded-full bg-yellow-500 flex items-center justify-center text-black font-black">U</div>
                <div><p class="text-[8px] text-gray-500 font-bold uppercase">Live Wallet</p><h1 id="balanceText" class="text-xl font-extrabold text-white">$0.00</h1></div>
            </div>
            <div class="flex gap-2">
                <button onclick="openModal('depModal')" class="bg-yellow-500 text-black px-4 py-2 rounded-xl text-[10px] font-black">DEPOSIT</button>
                <button onclick="openModal('witModal')" class="bg-white/5 text-white px-4 py-2 rounded-xl text-[10px] font-black border border-white/10">WITHDRAW</button>
            </div>
        </header>

        <div class="flex-grow bg-black/40 rounded-3xl border border-white/5 mb-4 flex items-center justify-center">
            <p class="text-gray-600 font-bold uppercase text-[10px]">Chart Area</p>
        </div>

        <footer class="p-4 bg-gray-900/50 rounded-3xl border border-white/5">
            <div class="grid grid-cols-2 gap-4">
                <button class="bg-green-600 py-4 rounded-2xl font-black text-white">UP</button>
                <button class="bg-red-600 py-4 rounded-2xl font-black text-white">DOWN</button>
            </div>
        </footer>
    </div>

    <div id="depModal" class="ui-modal">
        <div class="auth-card w-full">
            <h2 class="text-xl font-bold mb-4">Deposit USDT (TRC20)</h2>
            <p class="text-[10px] text-gray-400 mb-2">Address: TAaTmYha48Pbft4aJn1RGyKmVoQZKuLArM</p>
            <div class="input-box"><label>TXID / Transaction ID</label><input type="text" id="dTx"></div>
            <button onclick="finalDepSubmit()" class="w-full py-3 bg-yellow-500 text-black font-bold rounded-xl">Submit</button>
            <button onclick="closeModal('depModal')" class="w-full mt-2 text-gray-500 text-xs">Cancel</button>
        </div>
    </div>

    <div id="witModal" class="ui-modal">
        <div class="auth-card w-full">
            <h2 class="text-xl font-bold mb-4">Withdraw</h2>
            <div class="input-box"><label>Amount ($)</label><input type="number" id="wAmt"></div>
            <button onclick="executeWithdraw()" class="w-full py-3 bg-white text-black font-bold rounded-xl">Request Withdraw</button>
            <button onclick="closeModal('witModal')" class="w-full mt-2 text-gray-500 text-xs">Cancel</button>
        </div>
    </div>

    <div id="drawerOverlay" class="overlay" onclick="closeDrawer()"></div>
    <div id="sideDrawer" class="p-6">
        <div id="drawIco" class="w-16 h-16 rounded-full bg-yellow-500 flex items-center justify-center text-2xl font-black text-black mb-4">U</div>
        <p id="drawEmail" class="font-bold text-white"></p>
        <p id="drawID" class="text-[10px] text-gray-500 mb-8"></p>
        <button onclick="logout()" class="w-full py-3 bg-red-600/20 text-red-500 font-bold rounded-xl">Logout</button>
    </div>

    <script>
        function setAuthMode(mode) {
            const isLogin = mode === 'login';
            document.getElementById('tabLogin').classList.toggle('active', isLogin);
            document.getElementById('tabReg').classList.toggle('active', !isLogin);
            document.getElementById('regFields').classList.toggle('hidden', isLogin);
            document.getElementById('authSubmitBtn').innerText = isLogin ? 'Login ➔' : 'Sign Up ➔';
        }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function openDrawer() { document.getElementById('sideDrawer').classList.add('active'); document.getElementById('drawerOverlay').style.display = 'block'; }
        function closeDrawer() { document.getElementById('sideDrawer').classList.remove('active'); document.getElementById('drawerOverlay').style.display = 'none'; }
    </script>
</body>
</html>

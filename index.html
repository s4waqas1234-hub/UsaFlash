<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProTrade Global | Elite Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #05070a; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; height: 100dvh; margin: 0; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .btn-grad-green { background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); }
        .btn-grad-red { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; overflow-y: auto; }
        .auth-input { background: #1a1f29; border: 1px solid #2d3748; padding: 12px; border-radius: 8px; width: 100%; color: white; font-size: 14px; outline: none; }
        #appTerminal { display: none; height: 100dvh; flex-direction: column; padding: 8px; }
        .history-item { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 10px 0; }
    </style>
</head>
<body>

    <div id="authSection" class="h-full flex items-center justify-center p-4">
        </div>

    <div id="appTerminal">
        <header class="flex justify-between items-center mb-2 px-1">
            <div class="flex items-center gap-2">
                <div onclick="showM('settingsM')" class="w-9 h-9 rounded-full bg-yellow-500 flex items-center justify-center text-black font-bold uppercase cursor-pointer" id="userInitial">?</div>
                <div>
                    <p class="text-[8px] text-gray-400 font-bold uppercase">REAL BALANCE</p>
                    <h1 id="balanceDisp" class="text-xl font-extrabold text-white tracking-tight">$0.00</h1>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="showM('historyM')" class="bg-white/10 text-white px-3 py-1.5 rounded-lg text-[10px] font-black uppercase">History</button>
                <button onclick="showM('depM')" class="bg-yellow-500 text-black px-3 py-1.5 rounded-lg text-[10px] font-black uppercase">DEPOSIT</button>
            </div>
        </header>

        <div class="px-1 mb-2">
            <div class="bg-white/5 border border-white/10 rounded-xl px-3 py-2 flex items-center justify-between">
                <select id="assetSelect" onchange="updateAsset(this.value)" class="bg-transparent text-yellow-500 font-black text-xs outline-none">
                    <option value="BINANCE:BTCUSDT">BTC/USDT</option>
                    <option value="BINANCE:ETHUSDT">ETH/USDT</option>
                    <option value="BINANCE:SOLUSDT">SOL/USDT</option>
                </select>
                <div id="timerBox" class="hidden bg-red-500 text-white px-3 py-1 rounded-lg text-[10px] font-black animate-pulse">00:00</div>
            </div>
        </div>

        <main class="relative flex-grow rounded-2xl overflow-hidden border border-gray-800 bg-black mb-2">
            <div id="tv_chart" class="h-full w-full"></div>
        </main>

        <footer class="glass-card p-3 rounded-2xl">
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div class="bg-[#0f141e] px-4 py-2 rounded-xl border border-white/5">
                    <span class="text-[9px] text-gray-500 font-bold uppercase block mb-0.5">AMOUNT</span>
                    <input id="tradeAmt" type="number" value="10" class="bg-transparent outline-none font-bold text-white w-full">
                </div>
                <div class="bg-[#0f141e] px-4 py-2 rounded-xl border border-white/5">
                    <span class="text-[9px] text-gray-500 font-bold uppercase block mb-0.5">TIME</span>
                    <select id="duration" class="bg-transparent font-bold text-white w-full outline-none">
                        <option value="10">10 Sec</option>
                        <option value="30">30 Sec</option>
                        <option value="60">1 Min</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button id="callBtn" onclick="initTrade('UP')" class="btn-grad-green h-14 rounded-2xl font-black text-white text-sm uppercase">CALL</button>
                <button id="putBtn" onclick="initTrade('DOWN')" class="btn-grad-red h-14 rounded-2xl font-black text-white text-sm uppercase">PUT</button>
            </div>
        </footer>
    </div>

    <div id="historyM" class="modal">
        <div class="glass-card p-6 rounded-3xl w-[95%] max-w-md border border-white/10 max-h-[80vh] flex flex-col">
            <h2 class="text-lg font-bold mb-4 uppercase text-yellow-500 text-center">Trade History</h2>
            <div id="historyList" class="overflow-y-auto flex-grow space-y-2">
                </div>
            <button onclick="hideM('historyM')" class="mt-4 w-full py-3 bg-white/10 rounded-xl text-[10px] font-bold uppercase">Close</button>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // --- Firebase Config (Same as yours) ---
        const firebaseConfig = {
            apiKey: "AIzaSyAySRA1YSpTpmC8WjnKmDhnNMHkEmkeP50",
            authDomain: "waqas-47f30.firebaseapp.com",
            projectId: "waqas-47f30",
            storageBucket: "waqas-47f30.appspot.com",
            messagingSenderId: "374104279093",
            appId: "1:374104279093:web:6e1844b60456c700940364"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let userData = null;
        let currentSymbol = 'BINANCE:BTCUSDT';
        let isTrading = false;

        // --- Core Trading Logic ---

        async function initTrade(type) {
            if(isTrading) return;
            const amt = parseFloat(document.getElementById('tradeAmt').value);
            const dur = parseInt(document.getElementById('duration').value);

            if(!userData || userData.balance < amt || amt < 1) return alert("Insufficient Balance!");

            isTrading = true;
            toggleButtons(false);

            // Deduct Balance
            await db.collection('users').doc(auth.currentUser.uid).update({
                balance: firebase.firestore.FieldValue.increment(-amt)
            });

            // Start Visual Timer
            let timeLeft = dur;
            const timerBox = document.getElementById('timerBox');
            timerBox.classList.remove('hidden');
            
            const timerInterval = setInterval(() => {
                timeLeft--;
                timerBox.innerText = `00:${timeLeft < 10 ? '0'+timeLeft : timeLeft}`;
                if(timeLeft <= 0) clearInterval(timerInterval);
            }, 1000);

            // Simulate Market Logic (Randomized for demo, can be linked to real price)
            setTimeout(async () => {
                const win = Math.random() > 0.5; // 50/50 Chance
                const profit = amt * 1.85; 
                const result = win ? 'WIN' : 'LOSS';

                if(win) {
                    await db.collection('users').doc(auth.currentUser.uid).update({
                        balance: firebase.firestore.FieldValue.increment(profit)
                    });
                }

                // Save to Permanent History
                await db.collection('trades').add({
                    uid: auth.currentUser.uid,
                    email: auth.currentUser.email,
                    asset: currentSymbol,
                    amount: amt,
                    type: type,
                    result: result,
                    payout: win ? profit : 0,
                    time: Date.now()
                });

                alert(`Trade ${result}! ${win ? '+$'+profit.toFixed(2) : '-$'+amt}`);
                
                isTrading = false;
                toggleButtons(true);
                timerBox.classList.add('hidden');
            }, dur * 1000);
        }

        // --- History & UI ---

        function loadHistory() {
            db.collection('trades').where('uid', '==', auth.currentUser.uid).orderBy('time', 'desc').onSnapshot(snap => {
                const list = document.getElementById('historyList');
                list.innerHTML = "";
                snap.forEach(doc => {
                    const t = doc.data();
                    list.innerHTML += `
                        <div class="history-item flex justify-between items-center">
                            <div>
                                <p class="text-[10px] font-bold text-white">${t.asset.replace('BINANCE:','')}</p>
                                <p class="text-[8px] text-gray-500">${new Date(t.time).toLocaleTimeString()}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] font-black ${t.result === 'WIN' ? 'text-green-500' : 'text-red-500'}">${t.result} ($${t.amount})</p>
                                <p class="text-[9px] text-gray-400">${t.type}</p>
                            </div>
                        </div>
                    `;
                });
            });
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.collection('users').doc(user.uid).onSnapshot(doc => {
                    userData = doc.data();
                    document.getElementById('balanceDisp').innerText = "$" + (userData?.balance || 0).toFixed(2);
                    document.getElementById('appTerminal').style.display = 'flex';
                    loadHistory();
                    loadChart();
                });
            }
        });

        function toggleButtons(state) {
            document.getElementById('callBtn').disabled = !state;
            document.getElementById('putBtn').disabled = !state;
            document.getElementById('callBtn').style.opacity = state ? "1" : "0.5";
            document.getElementById('putBtn').style.opacity = state ? "1" : "0.5";
        }

        function loadChart() {
            new TradingView.widget({ "autosize": true, "symbol": currentSymbol, "interval": "1", "theme": "dark", "container_id": "tv_chart", "hide_top_toolbar": true, "hide_legend": true, "backgroundColor": "#05070a", "hide_side_toolbar": true });
        }
        function updateAsset(v) { currentSymbol = v; loadChart(); }
        function showM(id) { document.getElementById(id).style.display = 'flex'; }
        function hideM(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProTrade Global | Elite Affiliate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #05070a; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; height: 100dvh; margin: 0; overflow: hidden; }
        .glass-card { background: rgba(17, 24, 39, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .auth-input { background: #1a1f29; border: 1px solid #2d3748; padding: 14px; border-radius: 12px; width: 100%; color: white; outline: none; }
        .stat-card { background: linear-gradient(135deg, #111827 0%, #030712 100%); border: 1px solid rgba(59, 130, 246, 0.1); padding: 15px; border-radius: 20px; }
        #appTerminal { display: none; height: 100dvh; flex-direction: column; padding: 8px; }
        #loadingScreen { position: fixed; inset: 0; background: #05070a; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .loader-spin { width: 35px; height: 35px; border: 3px solid #1a1f29; border-top: 3px solid #3b82f6; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loadingScreen">
        <div class="loader-spin"></div>
        <p class="mt-3 text-[9px] font-bold text-blue-500 uppercase tracking-widest">Initialising Affiliate Engine...</p>
    </div>

    <div id="authSection" class="h-full flex items-center justify-center p-4" style="display:none;">
        <div class="glass-card w-full max-w-sm p-8 rounded-[32px]">
            <h1 class="text-3xl font-black text-center mb-8 uppercase italic">ProTrade</h1>
            <div class="flex bg-black/40 p-1.5 rounded-2xl mb-8">
                <button onclick="switchAuth('login')" id="loginTab" class="flex-1 py-3 text-sm font-bold">Login</button>
                <button onclick="switchAuth('reg')" id="regTab" class="flex-1 py-3 text-sm font-bold bg-[#2d3748] rounded-xl">Registration</button>
            </div>
            <input type="email" id="userEmail" placeholder="Email" class="auth-input mb-4">
            <input type="password" id="userPass" placeholder="Password" class="auth-input mb-6">
            <button onclick="handleAuth()" id="authBtn" class="w-full py-4 bg-blue-600 text-white font-black rounded-2xl uppercase">Registration</button>
        </div>
    </div>

    <div id="appTerminal">
        <header class="flex justify-between items-center mb-4 px-1">
            <div class="flex items-center gap-2">
                <div class="w-10 h-10 rounded-full bg-blue-600 flex items-center justify-center text-white font-black shadow-lg shadow-blue-500/20" id="userInitial">?</div>
                <div>
                    <p class="text-[7px] text-gray-500 font-bold uppercase">Affiliate Account</p>
                    <h1 id="userEmailDisp" class="text-[10px] font-black text-white italic">loading...</h1>
                </div>
            </div>
            <button onclick="auth.signOut().then(()=>location.reload())" class="bg-white/5 border border-white/10 px-3 py-2 rounded-xl text-[9px] font-bold uppercase">Logout</button>
        </header>

        <main class="flex-grow space-y-4 overflow-y-auto pb-4">
            <div class="grid grid-cols-2 gap-3">
                <div class="stat-card">
                    <span class="text-[8px] text-gray-500 font-bold uppercase">Total Clicks</span>
                    <h2 id="statClicks" class="text-2xl font-black text-white">0</h2>
                </div>
                <div class="stat-card">
                    <span class="text-[8px] text-gray-500 font-bold uppercase">Total Users</span>
                    <h2 id="statUsers" class="text-2xl font-black text-white">0</h2>
                </div>
                <div class="stat-card">
                    <span class="text-[8px] text-gray-500 font-bold uppercase">Total Deposits</span>
                    <h2 id="statDepAmt" class="text-2xl font-black text-green-500">$0.00</h2>
                </div>
                <div class="stat-card">
                    <span class="text-[8px] text-gray-500 font-bold uppercase">Commission (10%)</span>
                    <h2 id="statCommission" class="text-2xl font-black text-yellow-500">$0.00</h2>
                </div>
            </div>

            <div class="glass-card p-5 rounded-[28px] border border-blue-500/20">
                <p class="text-[9px] text-gray-500 font-bold uppercase mb-3 text-center">Your Unique Affiliate Link</p>
                <div class="bg-black/60 p-3 rounded-xl flex items-center gap-3">
                    <input id="affLink" type="text" readonly class="bg-transparent text-[10px] text-blue-400 font-bold flex-grow outline-none overflow-hidden" value="Loading...">
                    <button onclick="copyLink()" class="bg-blue-600 text-white text-[10px] px-4 py-2 rounded-lg font-black uppercase">Copy</button>
                </div>
            </div>

            <div class="glass-card p-5 rounded-[28px] flex-grow">
                <h3 class="text-[10px] font-black text-gray-400 uppercase mb-4 tracking-widest">Registered Users List</h3>
                <div id="userList" class="space-y-3">
                    <p class="text-[10px] text-gray-600 italic">Waiting for your first referral...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAySRA1YSpTpmC8WjnKmDhnNMHkEmkeP50", authDomain: "waqas-47f30.firebaseapp.com", projectId: "waqas-47f30", storageBucket: "waqas-47f30.appspot.com", messagingSenderId: "374104279093", appId: "1:374104279093:web:6e1844b60456c700940364" };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();
        let mode = 'reg';

        // 1. URL se Referral tracking
        const urlParams = new URLSearchParams(window.location.search);
        const refID = urlParams.get('ref');
        if(refID) {
            localStorage.setItem('activeRef', refID);
            // Click update in Firebase
            db.collection('affiliateStats').doc(refID).set({
                clicks: firebase.firestore.FieldValue.increment(1)
            }, { merge: true });
        }

        auth.onAuthStateChanged(user => {
            document.getElementById('loadingScreen').style.display = 'none';
            if(user) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('appTerminal').style.display = 'flex';
                setupDashboard(user);
            } else {
                document.getElementById('authSection').style.display = 'flex';
                document.getElementById('appTerminal').style.display = 'none';
            }
        });

        async function setupDashboard(user) {
            const myID = user.uid;
            const myLink = window.location.origin + window.location.pathname + "?ref=" + myID;
            document.getElementById('affLink').value = myLink;
            document.getElementById('userEmailDisp').innerText = user.email;
            document.getElementById('userInitial').innerText = user.email[0].toUpperCase();

            // Real-time stats update
            db.collection('affiliateStats').doc(myID).onSnapshot(doc => {
                if(doc.exists) {
                    const data = doc.data();
                    document.getElementById('statClicks').innerText = data.clicks || 0;
                    document.getElementById('statUsers').innerText = data.registrations || 0;
                    const totalDep = data.totalDeposit || 0;
                    document.getElementById('statDepAmt').innerText = "$" + totalDep.toFixed(2);
                    document.getElementById('statCommission').innerText = "$" + (totalDep * 0.10).toFixed(2);
                }
            });

            // Reffered Users Tracking
            db.collection('users').where('referredBy', '==', myID).onSnapshot(snap => {
                const list = document.getElementById('userList');
                list.innerHTML = "";
                if(snap.empty) {
                    list.innerHTML = `<p class="text-[10px] text-gray-600 italic">No registrations yet.</p>`;
                    return;
                }
                snap.forEach(doc => {
                    const u = doc.data();
                    list.innerHTML += `
                        <div class="flex justify-between items-center bg-white/5 p-3 rounded-xl border border-white/5">
                            <div>
                                <p class="text-[10px] font-bold text-white">${u.email}</p>
                                <p class="text-[7px] text-gray-500 font-bold uppercase">Status: Active</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] font-black text-green-500">$${(u.totalDeposited || 0).toFixed(2)}</p>
                                <p class="text-[7px] text-gray-500 font-bold uppercase">Deposit</p>
                            </div>
                        </div>`;
                });
            });
        }

        async function handleAuth() {
            const e = document.getElementById('userEmail').value, p = document.getElementById('userPass').value;
            if(!e || !p) return alert("Details enter karein");
            
            try {
                if(mode === 'reg') {
                    const r = await auth.createUserWithEmailAndPassword(e, p);
                    const referrer = localStorage.getItem('activeRef') || "direct";
                    
                    // Naye user ka data
                    await db.collection('users').doc(r.user.uid).set({
                        email: e,
                        balance: 0,
                        referredBy: referrer,
                        totalDeposited: 0,
                        tradeMode: 'normal'
                    });

                    // Affiliate ke statistics update karna
                    if(referrer !== "direct") {
                        await db.collection('affiliateStats').doc(referrer).set({
                            registrations: firebase.firestore.FieldValue.increment(1)
                        }, { merge: true });
                    }
                } else {
                    await auth.signInWithEmailAndPassword(e, p);
                }
            } catch(err) { alert(err.message); }
        }

        function switchAuth(t) {
            mode = t;
            document.getElementById('loginTab').className = t==='login' ? 'flex-1 py-3 text-sm font-bold bg-[#2d3748] rounded-xl' : 'flex-1 py-3 text-sm font-bold';
            document.getElementById('regTab').className = t==='reg' ? 'flex-1 py-3 text-sm font-bold bg-[#2d3748] rounded-xl' : 'flex-1 py-3 text-sm font-bold';
            document.getElementById('authBtn').innerText = t==='login' ? 'Login' : 'Registration';
        }

        function copyLink() {
            const linkField = document.getElementById('affLink');
            linkField.select();
            document.execCommand('copy');
            alert("Link Copied! Ab share karein.");
        }
    </script>
</body>
</html>

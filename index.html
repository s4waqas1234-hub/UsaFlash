<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProTrade Global | Elite Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #05070a; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; height: 100dvh; margin: 0; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .btn-grad-green { background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); }
        .btn-grad-red { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; }
        .auth-input { background: #1a1f29; border: 1px solid #2d3748; padding: 12px; border-radius: 8px; width: 100%; color: white; font-size: 14px; outline: none; }
        #appTerminal { display: none; height: 100dvh; flex-direction: column; padding: 8px; }
        .history-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="authSection" class="h-full flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-sm p-6 rounded-3xl border border-white/10">
            <h1 class="text-2xl font-extrabold text-center mb-6 uppercase tracking-tighter">ProTrade</h1>
            <div class="flex bg-black/40 p-1 rounded-xl mb-6">
                <button id="loginTab" onclick="switchTab('login')" class="flex-1 py-2 text-sm font-bold bg-[#2d3748] rounded-lg">Login</button>
                <button id="regTab" onclick="switchTab('reg')" class="flex-1 py-2 text-sm font-bold">Registration</button>
            </div>
            <div class="space-y-4">
                <div id="regFields" style="display:none">
                    <select class="auth-input mb-4"><option>Pakistan</option><option>India</option></select>
                </div>
                <input type="email" id="userEmail" placeholder="Email" class="auth-input">
                <input type="password" id="userPass" placeholder="Password" class="auth-input">
                <button onclick="handleAuth()" id="authBtn" class="w-full py-3 bg-blue-600 text-white font-black rounded-xl text-sm uppercase">Login</button>
            </div>
        </div>
    </div>

    <div id="appTerminal">
        <header class="flex justify-between items-center mb-2 px-1">
            <div class="flex items-center gap-2">
                <div onclick="showM('settingsM')" class="w-9 h-9 rounded-full bg-yellow-500 flex items-center justify-center text-black font-bold cursor-pointer" id="userInitial">?</div>
                <div>
                    <p class="text-[8px] text-gray-400 font-bold uppercase">REAL BALANCE</p>
                    <h1 id="balanceDisp" class="text-xl font-extrabold text-white tracking-tight">$0.00</h1>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="showM('historyM')" class="bg-white/10 text-white px-3 py-1.5 rounded-lg text-[10px] font-black uppercase border border-white/5">History</button>
                <button onclick="showM('depM')" class="bg-yellow-500 text-black px-3 py-1.5 rounded-lg text-[10px] font-black uppercase">DEPOSIT</button>
            </div>
        </header>

        <div class="px-1 mb-2">
            <div class="bg-white/5 border border-white/10 rounded-xl px-3 py-2 flex items-center justify-between">
                <select id="assetSelect" onchange="updateAsset(this.value)" class="bg-transparent text-yellow-500 font-black text-xs outline-none">
                    <option value="BINANCE:BTCUSDT">BTC/USDT</option>
                    <option value="BINANCE:ETHUSDT">ETH/USDT</option>
                    <option value="BINANCE:SOLUSDT">SOL/USDT</option>
                    <option value="FX:EURUSD">EUR/USD</option>
                </select>
                <div id="tradeTimer" class="hidden bg-red-600 text-white px-3 py-1 rounded-md text-[10px] font-black animate-pulse uppercase">Wait: 00s</div>
            </div>
        </div>

        <main class="relative flex-grow rounded-2xl overflow-hidden border border-gray-800 bg-black mb-2">
            <div id="tv_chart" class="h-full w-full"></div>
        </main>

        <footer class="glass-card p-3 rounded-2xl">
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div class="bg-[#0f141e] px-4 py-2 rounded-xl border border-white/5">
                    <span class="text-[9px] text-gray-500 font-bold uppercase block mb-0.5">AMOUNT</span>
                    <input id="tradeAmt" type="number" value="10" class="bg-transparent outline-none font-bold text-white w-full">
                </div>
                <div class="bg-[#0f141e] px-4 py-2 rounded-xl border border-white/5">
                    <span class="text-[9px] text-gray-500 font-bold uppercase block mb-0.5">TIME</span>
                    <select id="duration" class="bg-transparent font-bold text-white w-full outline-none">
                        <option value="15">15 Sec</option>
                        <option value="30">30 Sec</option>
                        <option value="60">1 Min</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button id="callBtn" onclick="initTrade('CALL')" class="btn-grad-green h-14 rounded-2xl font-black text-white text-sm uppercase">CALL</button>
                <button id="putBtn" onclick="initTrade('PUT')" class="btn-grad-red h-14 rounded-2xl font-black text-white text-sm uppercase">PUT</button>
            </div>
        </footer>
    </div>

    <div id="historyM" class="modal">
        <div class="glass-card p-6 rounded-3xl w-[90%] max-w-sm border border-white/10 h-[70vh] flex flex-col">
            <h2 class="text-lg font-bold mb-4 uppercase text-yellow-500 text-center">Trade History</h2>
            <div id="historyContainer" class="flex-grow overflow-y-auto space-y-2 pr-1">
                </div>
            <button onclick="hideM('historyM')" class="mt-4 w-full py-3 bg-white/5 text-gray-400 font-bold rounded-xl text-[10px] uppercase">Close</button>
        </div>
    </div>

    <div id="depM" class="modal">
        <div class="glass-card p-6 rounded-3xl w-[90%] max-w-sm text-center border border-white/10">
            <div id="depStep0">
                <h2 class="text-lg font-bold mb-4 uppercase text-yellow-500">Deposit</h2>
                <input type="number" id="depAmountInput" placeholder="Enter Amount" class="auth-input mb-4 text-center">
                <button onclick="goToDepStep1()" class="w-full py-3 bg-yellow-500 text-black font-black rounded-xl text-xs uppercase">Next</button>
                <button onclick="hideM('depM')" class="mt-4 text-gray-500 text-[10px] font-bold uppercase block w-full">Cancel</button>
            </div>
            <div id="depStep1" class="hidden">
                <h2 class="text-lg font-bold mb-4 uppercase text-yellow-500">TRC20 Address</h2>
                <div class="bg-white p-2 rounded-xl mb-4 w-32 mx-auto">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=TAaTmYha48Pbft4aJn1RGyKmVoQZKuLArM">
                </div>
                <code class="text-[10px] text-white block bg-black/50 p-2 rounded mb-4">TAaTmYha48Pbft4aJn1RGyKmVoQZKuLArM</code>
                <button onclick="showDepForm()" class="w-full py-3 bg-yellow-500 text-black font-black rounded-xl text-xs uppercase">I Have Paid</button>
            </div>
            <div id="depStep2" class="hidden">
                <h2 class="text-lg font-bold mb-4 uppercase text-yellow-500">Proof</h2>
                <input type="text" id="userTg" placeholder="Telegram @username" class="auth-input mb-2">
                <input type="text" id="txid" placeholder="Transaction ID (TXID)" class="auth-input mb-4">
                <button onclick="finalSubmitDeposit()" class="w-full py-3 bg-blue-600 text-white font-black rounded-xl text-xs uppercase">Submit</button>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAySRA1YSpTpmC8WjnKmDhnNMHkEmkeP50",
            authDomain: "waqas-47f30.firebaseapp.com",
            projectId: "waqas-47f30",
            storageBucket: "waqas-47f30.appspot.com",
            messagingSenderId: "374104279093",
            appId: "1:374104279093:web:6e1844b60456c700940364"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let userData = null;
        let isTrading = false;
        let currentSymbol = 'BINANCE:BTCUSDT';

        // --- Trading Logic ---
        async function initTrade(type) {
            if(isTrading) return;
            const amt = parseFloat(document.getElementById('tradeAmt').value);
            const dur = parseInt(document.getElementById('duration').value);

            if(!userData || userData.balance < amt || amt <= 0) return alert("Low Balance!");

            isTrading = true;
            toggleControls(false);

            // Deduct Balance Foran
            await db.collection('users').doc(auth.currentUser.uid).update({
                balance: firebase.firestore.FieldValue.increment(-amt)
            });

            // Timer UI
            let timeLeft = dur;
            const tBox = document.getElementById('tradeTimer');
            tBox.classList.remove('hidden');
            const timerInt = setInterval(() => {
                timeLeft--;
                tBox.innerText = `Wait: ${timeLeft}s`;
                if(timeLeft <= 0) clearInterval(timerInt);
            }, 1000);

            // Finish Trade After Duration
            setTimeout(async () => {
                const win = Math.random() > 0.48; // AI Logic / Random
                const payout = win ? (amt * 1.85) : 0;
                const result = win ? 'WIN' : 'LOSS';

                if(win) {
                    await db.collection('users').doc(auth.currentUser.uid).update({
                        balance: firebase.firestore.FieldValue.increment(payout)
                    });
                }

                // Save to Permanent History
                await db.collection('trades').add({
                    uid: auth.currentUser.uid,
                    email: auth.currentUser.email,
                    asset: currentSymbol,
                    amount: amt,
                    type: type,
                    result: result,
                    payout: payout,
                    timestamp: Date.now()
                });

                alert(result === 'WIN' ? `Profit! +$${payout.toFixed(2)}` : `Loss! -$${amt}`);
                
                isTrading = false;
                tBox.classList.add('hidden');
                toggleControls(true);
            }, dur * 1000);
        }

        function loadHistory() {
            db.collection('trades').where('uid', '==', auth.currentUser.uid).orderBy('timestamp', 'desc').onSnapshot(snap => {
                const container = document.getElementById('historyContainer');
                container.innerHTML = "";
                snap.forEach(doc => {
                    const t = doc.data();
                    const color = t.result === 'WIN' ? 'text-green-500' : 'text-red-500';
                    container.innerHTML += `
                        <div class="history-card p-3 rounded-xl flex justify-between items-center">
                            <div>
                                <p class="text-[10px] font-black text-white">${t.asset.split(':')[1]}</p>
                                <p class="text-[8px] text-gray-500">${new Date(t.timestamp).toLocaleTimeString()}</p>
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] font-bold ${color}">${t.result} $${t.amount}</p>
                                <p class="text-[8px] text-gray-400">${t.type}</p>
                            </div>
                        </div>
                    `;
                });
            });
        }

        // --- UI & Auth ---
        auth.onAuthStateChanged(user => {
            if(user) {
                db.collection('users').doc(user.uid).onSnapshot(doc => {
                    userData = doc.data();
                    document.getElementById('balanceDisp').innerText = "$" + (userData?.balance || 0).toFixed(2);
                    document.getElementById('userInitial').innerText = user.email.charAt(0).toUpperCase();
                    document.getElementById('authSection').style.display = 'none';
                    document.getElementById('appTerminal').style.display = 'flex';
                    loadChart();
                    loadHistory();
                });
            } else {
                document.getElementById('authSection').style.display = 'flex';
                document.getElementById('appTerminal').style.display = 'none';
            }
        });

        function switchTab(mode) {
            document.getElementById('regFields').style.display = mode === 'reg' ? 'block' : 'none';
            document.getElementById('authBtn').innerText = mode === 'reg' ? 'Registration' : 'Login';
        }

        async function handleAuth() {
            const email = document.getElementById('userEmail').value;
            const pass = document.getElementById('userPass').value;
            const mode = document.getElementById('authBtn').innerText;
            try {
                if(mode === 'Registration') {
                    const res = await auth.createUserWithEmailAndPassword(email, pass);
                    await db.collection('users').doc(res.user.uid).set({ email, balance: 0, status: 'active' });
                } else {
                    await auth.signInWithEmailAndPassword(email, pass);
                }
            } catch(e) { alert(e.message); }
        }

        function loadChart() {
            new TradingView.widget({ "autosize": true, "symbol": currentSymbol, "interval": "1", "theme": "dark", "container_id": "tv_chart", "hide_top_toolbar": true, "hide_legend": true, "hide_side_toolbar": true });
        }
        function updateAsset(v) { currentSymbol = v; loadChart(); }
        function toggleControls(s) {
            document.getElementById('callBtn').disabled = !s;
            document.getElementById('putBtn').disabled = !s;
            document.getElementById('callBtn').style.opacity = s ? "1" : "0.5";
            document.getElementById('putBtn').style.opacity = s ? "1" : "0.5";
        }
        function showM(id) { document.getElementById(id).style.display = 'flex'; }
        function hideM(id) { document.getElementById(id).style.display = 'none'; }
        function goToDepStep1() { document.getElementById('depStep0').classList.add('hidden'); document.getElementById('depStep1').classList.remove('hidden'); }
        function showDepForm() { document.getElementById('depStep1').classList.add('hidden'); document.getElementById('depStep2').classList.remove('hidden'); }
        async function finalSubmitDeposit() {
            const amt = document.getElementById('depAmountInput').value;
            await db.collection('requests').add({ uid: auth.currentUser.uid, email: auth.currentUser.email, amount: parseFloat(amt), status: 'pending', time: Date.now() });
            alert("Proof Submitted!"); hideM('depM');
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProTrade Global | Elite Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #05070a; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; height: 100dvh; margin: 0; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .btn-grad-green { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-grad-red { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        input, select { background: #1f2937; border: 1px solid #374151; border-radius: 12px; padding: 12px; color: white; width: 100%; outline: none; }
    </style>
</head>
<body class="flex flex-col">

    <div id="authScreen" class="fixed inset-0 z-[2000] bg-[#05070a] flex items-center justify-center p-6">
        <div class="glass-card w-full max-w-sm p-8 rounded-[32px] space-y-6 border-yellow-500/20">
            <div class="text-center">
                <h1 class="text-3xl font-black text-yellow-500 italic tracking-tighter">PROTRADE</h1>
                <p class="text-[10px] text-gray-500 font-bold tracking-[0.2em] uppercase">Secure Login Access</p>
            </div>
            <div class="space-y-4">
                <input type="email" id="email" placeholder="Email Address">
                <input type="password" id="pass" placeholder="Password">
                <button onclick="handleAuth('login')" class="w-full bg-yellow-500 text-black font-black py-4 rounded-2xl hover:scale-95 transition">LOGIN</button>
                <button onclick="handleAuth('signup')" class="w-full text-gray-500 font-bold text-xs uppercase">Register New Account</button>
            </div>
        </div>
    </div>

    <header class="p-4 flex justify-between items-center border-b border-white/5">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-yellow-500 rounded-lg flex items-center justify-center font-black text-black italic">P</div>
            <p class="font-black tracking-tight">PROTRADE <span class="text-yellow-500 italic">ELITE</span></p>
        </div>
        <div class="glass-card px-4 py-2 rounded-2xl flex items-center gap-3">
            <div class="text-right">
                <p class="text-[8px] text-gray-500 font-bold">LIVE BALANCE</p>
                <p class="text-sm font-black text-green-500" id="userBalance">$0.00</p>
            </div>
            <button onclick="showM('depM')" class="bg-yellow-500 text-black w-6 h-6 rounded-lg flex items-center justify-center font-black">+</button>
        </div>
    </header>

    <main class="flex-1 overflow-hidden p-4 space-y-4">
        <div class="glass-card w-full h-1/2 rounded-[28px] overflow-hidden border-white/5">
            <iframe src="https://s.tradingview.com/widgetembed/?symbol=BINANCE%3ABTCUSDT&interval=1&theme=dark" class="w-full h-full border-none"></iframe>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div class="glass-card p-4 rounded-3xl">
                <p class="text-[8px] text-gray-500 font-bold uppercase mb-1">Amount ($)</p>
                <input type="number" id="tradeAmt" value="10" class="bg-transparent border-none p-0 text-xl font-black">
            </div>
            <div class="glass-card p-4 rounded-3xl">
                <p class="text-[8px] text-gray-500 font-bold uppercase mb-1">Duration</p>
                <select id="duration" class="bg-transparent border-none p-0 text-xl font-black appearance-none">
                    <option value="10" class="bg-[#05070a]">10 Sec</option>
                    <option value="30" class="bg-[#05070a]">30 Sec</option>
                    <option value="60" class="bg-[#05070a]">1 Min</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <button onclick="initTrade('UP')" class="btn-grad-green h-20 rounded-[32px] flex flex-col items-center justify-center active:scale-95 transition">
                <span class="text-xl">▲</span><span class="font-black text-xs uppercase italic">Buy / Call</span>
            </button>
            <button onclick="initTrade('DOWN')" class="btn-grad-red h-20 rounded-[32px] flex flex-col items-center justify-center active:scale-95 transition">
                <span class="text-xl">▼</span><span class="font-black text-xs uppercase italic">Sell / Put</span>
            </button>
        </div>
    </main>

    <div id="tradeModal" class="modal">
        <div class="glass-card w-full max-w-xs p-8 rounded-[40px] text-center space-y-6 border-white/10">
            <div id="tradeLoading">
                <div class="w-16 h-16 border-4 border-yellow-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <h3 class="text-lg font-black italic uppercase">Order Pending</h3>
                <p class="text-xs text-gray-500 font-mono" id="timerDisplay">Waiting for market result...</p>
            </div>
            <div id="tradeResult" class="hidden">
                <div id="resIcon" class="text-5xl mb-2">💰</div>
                <h2 id="resultTitle" class="text-4xl font-black italic">WIN</h2>
                <p id="resultMsg" class="text-xs text-gray-400 font-bold"></p>
                <button onclick="hideM('tradeModal')" class="w-full bg-white/5 border border-white/10 py-4 rounded-2xl font-black mt-4 uppercase text-[10px]">Back to Terminal</button>
            </div>
        </div>
    </div>

    <div id="depM" class="modal">
        <div class="glass-card w-full max-w-sm p-6 rounded-[32px] space-y-4">
            <div class="flex justify-between items-center"><h3 class="font-black italic">DEPOSIT USDT</h3><button onclick="hideM('depM')">✕</button></div>
            <div id="depStep1" class="space-y-4">
                <input type="number" id="depAmountInput" placeholder="Amount ($)">
                <button onclick="nextDep()" class="w-full bg-yellow-500 text-black font-black py-4 rounded-2xl">PROCEED</button>
            </div>
            <div id="depStep2" class="hidden space-y-4">
                <p class="text-[10px] text-gray-500 font-bold uppercase">Address (BEP20):</p>
                <p class="text-[10px] font-mono break-all text-yellow-500 bg-black/40 p-3 rounded-xl border border-white/5">0x074B47mYha48Pbft4aJn1RGyKmVoQZKuLArM</p>
                <input type="text" id="userTg" placeholder="Telegram Username">
                <input type="text" id="txid" placeholder="Transaction ID (TXID)">
                <button onclick="finalSubmitDeposit()" class="w-full bg-green-600 font-black py-4 rounded-2xl italic">SUBMIT PROOF</button>
            </div>
        </div>
    </div>

    <script>
        // FIREBASE CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyAySRA1YSpTpmC8WjnKmDhnNMHkEmkeP50",
            authDomain: "waqas-47f30.firebaseapp.com",
            projectId: "waqas-47f30",
            storageBucket: "waqas-47f30.appspot.com",
            messagingSenderId: "374104279093",
            appId: "1:374104279093:web:6e1844b60456c700940364"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let userData = null;

        // AUTH SYSTEM
        async function handleAuth(type) {
            const e = document.getElementById('email').value;
            const p = document.getElementById('pass').value;
            try {
                if(type === 'login') {
                    await auth.signInWithEmailAndPassword(e, p);
                } else {
                    const res = await auth.createUserWithEmailAndPassword(e, p);
                    await db.collection('users').doc(res.user.uid).set({
                        email: e, balance: 1000, status: 'active', password: p, tradeControl: 'normal'
                    });
                }
            } catch(err) { alert(err.message); }
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                document.getElementById('authScreen').style.display = 'none';
                db.collection('users').doc(user.uid).onSnapshot(doc => {
                    userData = doc.data();
                    if(userData.status === 'blocked') { alert("Blocked!"); auth.signOut(); }
                    document.getElementById('userBalance').innerText = `$${userData.balance.toFixed(2)}`;
                });
            } else { document.getElementById('authScreen').style.display = 'flex'; }
        });

        // UPDATED TRADING LOGIC (ADMIN SYNC)
        async function initTrade(type) {
            const amt = parseFloat(document.getElementById('tradeAmt').value);
            const dur = parseInt(document.getElementById('duration').value);

            if(!userData || amt > userData.balance || amt <= 0) return alert("Check Balance/Amount!");

            // Deduct Balance
            await db.collection('users').doc(auth.currentUser.uid).update({
                balance: firebase.firestore.FieldValue.increment(-amt)
            });

            // Show UI Timer
            showM('tradeModal');
            document.getElementById('tradeLoading').style.display = 'block';
            document.getElementById('tradeResult').style.display = 'none';
            
            let timeLeft = dur;
            const timer = setInterval(() => {
                timeLeft--;
                document.getElementById('timerDisplay').innerText = `Calculating in ${timeLeft}s...`;
                if(timeLeft <= 0) clearInterval(timer);
            }, 1000);

            // Wait for duration then decide result
            setTimeout(async () => {
                const control = userData.tradeControl || 'normal';
                let isWin = false;

                // ADMIN CONTROL LOGIC
                if (control === 'force_win') {
                    isWin = true;
                } else if (control === 'force_loss') {
                    isWin = false;
                } else {
                    // Normal market behavior (Random for demo)
                    isWin = Math.random() > 0.5;
                }

                // UI Update Result
                document.getElementById('tradeLoading').style.display = 'none';
                document.getElementById('tradeResult').style.display = 'block';

                if(isWin) {
                    const profit = amt * 1.8; // 80% Profit
                    await db.collection('users').doc(auth.currentUser.uid).update({
                        balance: firebase.firestore.FieldValue.increment(profit)
                    });
                    document.getElementById('resIcon').innerText = "💰";
                    document.getElementById('resultTitle').innerText = "WIN";
                    document.getElementById('resultTitle').className = "text-4xl font-black italic text-green-500";
                    document.getElementById('resultMsg').innerText = `Payout: +$${profit.toFixed(2)}`;
                } else {
                    document.getElementById('resIcon').innerText = "📉";
                    document.getElementById('resultTitle').innerText = "LOSS";
                    document.getElementById('resultTitle').className = "text-4xl font-black italic text-red-500";
                    document.getElementById('resultMsg').innerText = `Trade failed. Try again!`;
                }
            }, dur * 1000);
        }

        // HELPERS
        function showM(id) { document.getElementById(id).style.display = 'flex'; }
        function hideM(id) { document.getElementById(id).style.display = 'none'; }
        function nextDep() { document.getElementById('depStep1').classList.add('hidden'); document.getElementById('depStep2').classList.remove('hidden'); }
        async function finalSubmitDeposit() {
            const amt = parseFloat(document.getElementById('depAmountInput').value);
            const tg = document.getElementById('userTg').value;
            const tx = document.getElementById('txid').value;
            if(!tg || !tx) return alert("Missing Info");
            await db.collection('requests').add({
                uid: auth.currentUser.uid, email: auth.currentUser.email,
                telegram: tg, txid: tx, amount: amt, status: 'pending', time: Date.now()
            });
            alert("Submitted!"); hideM('depM');
        }
    </script>
</body>
</html>

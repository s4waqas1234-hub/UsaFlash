<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProTrade Global | Elite Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        body { background: #05070a; color: #e2e8f0; font-family: 'Plus Jakarta Sans', sans-serif; overflow: hidden; height: 100dvh; margin: 0; }
        .glass-card { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .btn-grad-green { background: linear-gradient(135deg, #22c55e 0%, #15803d 100%); }
        .btn-grad-red { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; }
        .auth-input { background: #1a1f29; border: 1px solid #2d3748; padding: 12px; border-radius: 8px; width: 100%; color: white; font-size: 14px; outline: none; }
        #appTerminal { display: none; height: 100dvh; flex-direction: column; padding: 8px; }
        .tab-btn.active { background: #2d3748; color: white; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="authSection" class="h-full flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-sm p-6 rounded-3xl border border-white/10">
            <h1 class="text-2xl font-extrabold text-center mb-6 uppercase tracking-tighter">ProTrade</h1>
            <div class="flex bg-black/40 p-1 rounded-xl mb-6">
                <button id="loginTab" onclick="switchTab('login')" class="tab-btn flex-1 py-2 text-sm font-bold">Login</button>
                <button id="regTab" onclick="switchTab('reg')" class="tab-btn active flex-1 py-2 text-sm font-bold">Registration</button>
            </div>
            <div class="space-y-4">
                <div id="regFields">
                    <select class="auth-input mb-4"><option>Pakistan</option><option>India</option></select>
                    <select class="auth-input mb-4"><option>USDT</option></select>
                </div>
                <input type="email" id="userEmail" placeholder="Email" class="auth-input">
                <input type="password" id="userPass" placeholder="Password" class="auth-input">
                <button onclick="handleAuth()" id="authBtn" class="w-full py-3 bg-blue-600 text-white font-black rounded-xl text-sm uppercase font-bold tracking-wider">Registration</button>
            </div>
        </div>
    </div>

    <div id="appTerminal">
        <header class="flex justify-between items-center mb-2 px-1">
            <div class="flex items-center gap-2">
                <div onclick="showM('settingsM')" class="w-9 h-9 rounded-full bg-yellow-500 flex items-center justify-center text-black font-bold uppercase cursor-pointer" id="userInitial">?</div>
                <div>
                    <p class="text-[8px] text-gray-400 font-bold uppercase">REAL BALANCE</p>
                    <h1 id="balanceDisp" class="text-xl font-extrabold text-white tracking-tight">$0.00</h1>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="showM('depM')" class="bg-yellow-500 text-black px-3 py-1.5 rounded-lg text-[10px] font-black uppercase">DEPOSIT</button>
                <button onclick="showM('witM')" class="bg-white text-black px-3 py-1.5 rounded-lg text-[10px] font-black uppercase">WITHDRAW</button>
            </div>
        </header>

        <div class="px-1 mb-2">
            <div class="bg-white/5 border border-white/10 rounded-xl px-3 py-2 flex items-center justify-between">
                <span class="text-[9px] text-gray-500 font-bold uppercase">Select Asset</span>
                <select id="assetSelect" onchange="updateAsset(this.value)" class="bg-transparent text-yellow-500 font-black text-xs outline-none">
                    <option value="BINANCE:BTCUSDT">BTC/USDT</option>
                    <option value="BINANCE:ETHUSDT">ETH/USDT</option>
                    <option value="BINANCE:SOLUSDT">SOL/USDT</option>
                    <option value="FX:EURUSD">EUR/USD</option>
                    <option value="OANDA:XAUUSD">GOLD</option>
                </select>
            </div>
        </div>

        <main class="relative flex-grow rounded-2xl overflow-hidden border border-gray-800 bg-black mb-2">
            <div id="tv_chart" class="h-full w-full"></div>
            <div id="statusBox" class="hidden absolute top-2 right-2 bg-yellow-500 text-black px-3 py-1 rounded-full text-[9px] font-black z-50 uppercase">Trade Active...</div>
        </main>

        <footer class="glass-card p-3 rounded-2xl">
            <div class="grid grid-cols-2 gap-3 mb-3">
                <div class="bg-[#0f141e] px-4 py-2 rounded-xl border border-white/5">
                    <span class="text-[9px] text-gray-500 font-bold uppercase block mb-0.5">AMOUNT</span>
                    <input id="tradeAmt" type="number" value="10" class="bg-transparent outline-none font-bold text-white w-full">
                </div>
                <div class="bg-[#0f141e] px-4 py-2 rounded-xl border border-white/5">
                    <span class="text-[9px] text-gray-500 font-bold uppercase block mb-0.5">TIME</span>
                    <select id="duration" class="bg-transparent font-bold text-white w-full outline-none">
                        <option value="5">5 Sec</option>
                        <option value="15">15 Sec</option>
                        <option value="30">30 Sec</option>
                        <option value="60">60 Sec</option>
                    </select>
                </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
                <button onclick="initTrade('UP')" class="btn-grad-green h-14 rounded-2xl font-black text-white text-sm uppercase">CALL</button>
                <button onclick="initTrade('DOWN')" class="btn-grad-red h-14 rounded-2xl font-black text-white text-sm uppercase">PUT</button>
            </div>
        </footer>
    </div>

    <div id="depM" class="modal">
        <div class="glass-card p-6 rounded-3xl w-[90%] max-w-sm text-center border border-white/10">
            <div id="depStep0">
                <h2 class="text-lg font-bold mb-4 uppercase text-yellow-500">Deposit Funds</h2>
                <input type="number" id="depAmountInput" placeholder="Minimum $10" class="auth-input mb-4 text-center text-lg">
                <button onclick="goToDepStep1()" class="w-full py-3 bg-yellow-500 text-black font-black rounded-xl text-xs uppercase">Next</button>
                <button onclick="hideM('depM')" class="mt-4 text-gray-500 text-[10px] font-bold uppercase block w-full">Cancel</button>
            </div>
            <div id="depStep1" class="hidden">
                <h2 class="text-lg font-bold mb-4 uppercase text-yellow-500">USDT (TRC20)</h2>
                <div class="bg-white p-2 rounded-xl mb-4 w-40 mx-auto">
                    <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=TAaTmYha48Pbft4aJn1RGyKmVoQZKuLArM" alt="QR">
                </div>
                <div class="bg-black/50 p-3 rounded-xl mb-4 flex items-center justify-between overflow-hidden">
                    <code class="text-[10px] text-white truncate mr-2">TAaTmYha48Pbft4aJn1RGyKmVoQZKuLArM</code>
                    <button onclick="copyAddr()" class="text-yellow-500 font-bold text-[10px] uppercase">Copy</button>
                </div>
                <button onclick="showDepForm()" class="w-full py-3 bg-yellow-500 text-black font-black rounded-xl text-xs uppercase">I Have Paid</button>
            </div>
            <div id="depStep2" class="hidden text-left">
                <input type="text" id="userTg" placeholder="Telegram ID" class="auth-input mb-3">
                <input type="text" id="txid" placeholder="Transaction ID (TXID)" class="auth-input mb-4">
                <button onclick="finalSubmitDeposit()" class="w-full py-3 bg-yellow-500 text-black font-black rounded-xl text-xs uppercase">Submit Proof</button>
            </div>
        </div>
    </div>

    <div id="witM" class="modal">
        <div class="glass-card p-6 rounded-3xl w-[90%] max-w-sm text-center border border-white/10">
            <h2 class="text-lg font-bold mb-4 uppercase text-white">Withdrawal</h2>
            <input type="number" id="witAmt" placeholder="Amount" class="auth-input mb-3">
            <input type="text" id="witAddr" placeholder="USDT Address (TRC20)" class="auth-input mb-4">
            <button onclick="handleWit()" class="w-full py-3 bg-white text-black font-black rounded-xl text-xs uppercase">Request Withdrawal</button>
            <button onclick="hideM('witM')" class="mt-4 text-gray-500 text-[10px] font-bold uppercase block w-full">Close</button>
        </div>
    </div>

    <div id="settingsM" class="modal">
        <div class="glass-card p-6 rounded-3xl w-[90%] max-w-sm border border-white/10">
            <div class="flex items-center gap-4 mb-6">
                <div class="w-16 h-16 rounded-full bg-yellow-500 flex items-center justify-center text-2xl text-black font-black uppercase" id="setInitial">?</div>
                <div>
                    <p id="setEmail" class="text-white font-bold text-sm truncate w-40">user@example.com</p>
                    <p class="text-[10px] text-yellow-500 font-bold uppercase">Verified Account</p>
                </div>
            </div>
            <div class="space-y-3">
                <button onclick="auth.signOut(); location.reload();" class="w-full py-3 bg-red-600/20 text-red-500 border border-red-600/30 font-bold rounded-xl text-xs uppercase">Logout</button>
                <button onclick="hideM('settingsM')" class="w-full py-3 bg-white/5 text-gray-400 font-bold rounded-xl text-xs uppercase">Close Settings</button>
            </div>
        </div>
    </div>

    <script src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // FIREBASE CONFIG (ADD YOUR REAL CONFIG HERE)
        const firebaseConfig = { apiKey: "AIzaSy...", authDomain: "...", projectId: "...", storageBucket: "...", messagingSenderId: "...", appId: "..." };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(), db = firebase.firestore();

        let userData = null;
        let activeTab = 'reg';

        auth.onAuthStateChanged(user => {
            if (user) {
                db.collection('users').doc(user.uid).onSnapshot(doc => {
                    userData = doc.data();
                    if(!userData) {
                        db.collection('users').doc(user.uid).set({ email: user.email, balance: 1000.00 });
                    } else {
                        document.getElementById('balanceDisp').innerText = `$${userData.balance.toFixed(2)}`;
                        document.getElementById('userInitial').innerText = userData.email[0];
                        document.getElementById('setInitial').innerText = userData.email[0];
                        document.getElementById('setEmail').innerText = userData.email;
                        document.getElementById('authSection').style.display = 'none';
                        document.getElementById('appTerminal').style.display = 'flex';
                        initChart();
                    }
                });
            } else {
                document.getElementById('authSection').style.display = 'flex';
                document.getElementById('appTerminal').style.display = 'none';
            }
        });

        function switchTab(t) {
            activeTab = t;
            document.getElementById('loginTab').classList.toggle('active', t === 'login');
            document.getElementById('regTab').classList.toggle('active', t === 'reg');
            document.getElementById('regFields').style.display = t === 'reg' ? 'block' : 'none';
            document.getElementById('authBtn').innerText = t === 'reg' ? 'Registration' : 'Login';
        }

        async function handleAuth() {
            const email = document.getElementById('userEmail').value;
            const pass = document.getElementById('userPass').value;
            if(!email || !pass) return alert("Fill all fields");
            try {
                if(activeTab === 'reg') await auth.createUserWithEmailAndPassword(email, pass);
                else await auth.signInWithEmailAndPassword(email, pass);
            } catch(e) { alert(e.message); }
        }

        let widget;
        function initChart(symbol = "BINANCE:BTCUSDT") {
            widget = new TradingView.widget({
                "autosize": true, "symbol": symbol, "interval": "1", "timezone": "Etc/UTC", "theme": "dark", "style": "1",
                "locale": "en", "toolbar_bg": "#f1f3f6", "enable_publishing": false, "hide_top_toolbar": true, "save_image": false,
                "container_id": "tv_chart"
            });
        }

        function updateAsset(val) { initChart(val); }

        // --- UPDATED TRADE LOGIC WITH COUNTDOWN ---
        async function initTrade(type) {
            const amt = parseFloat(document.getElementById('tradeAmt').value);
            const dur = parseInt(document.getElementById('duration').value);
            const statusBox = document.getElementById('statusBox');

            if(!userData || amt > userData.balance || amt <= 0) return alert("Insufficient Balance or Invalid Amount");

            // Deduct Amount Immediately
            let currentBal = userData.balance - amt;
            await db.collection('users').doc(auth.currentUser.uid).update({ balance: currentBal });

            // Start Countdown Timer
            let timeLeft = dur;
            statusBox.classList.remove('hidden');
            statusBox.innerText = `TRADE ACTIVE: ${timeLeft}s`;

            const timer = setInterval(() => {
                timeLeft--;
                statusBox.innerText = `TRADE ACTIVE: ${timeLeft}s`;
                if(timeLeft <= 0) clearInterval(timer);
            }, 1000);

            // Finish Trade Logic
            setTimeout(async () => {
                statusBox.classList.add('hidden');
                
                // Logic: 50/50 Win/Loss (Aap ise market price se bhi connect kar sakte hain)
                const isWin = Math.random() > 0.45; 
                if(isWin) {
                    const profit = amt * 1.85; // 85% Profit
                    currentBal += profit;
                    await db.collection('users').doc(auth.currentUser.uid).update({ balance: currentBal });
                    alert(`PROFIT! Result: $${profit.toFixed(2)} added.`);
                } else {
                    alert(`LOSS! Result: -$${amt.toFixed(2)}.`);
                }
            }, dur * 1000);
        }

        // Deposit/Withdrawal functions
        function goToDepStep1() { 
            const val = document.getElementById('depAmountInput').value;
            if(val < 10) return alert("Min $10");
            document.getElementById('depStep0').classList.add('hidden');
            document.getElementById('depStep1').classList.remove('hidden');
        }
        function showDepForm() { 
            document.getElementById('depStep1').classList.add('hidden');
            document.getElementById('depStep2').classList.remove('hidden');
        }
        function copyAddr() { navigator.clipboard.writeText("TAaTmYha48Pbft4aJn1RGyKmVoQZKuLArM"); alert("Copied!"); }
        
        async function finalSubmitDeposit() {
            const amt = parseFloat(document.getElementById('depAmountInput').value);
            const tg = document.getElementById('userTg').value;
            const tx = document.getElementById('txid').value;
            if(!tg || !tx) return alert("Fill details!");
            await db.collection('requests').add({ uid: auth.currentUser.uid, email: auth.currentUser.email, telegram: tg, txid: tx, amount: amt, status: 'pending', time: Date.now() });
            alert("Deposit request submitted!");
            hideM('depM');
        }

        async function handleWit() {
            const amt = parseFloat(document.getElementById('witAmt').value);
            const addr = document.getElementById('witAddr').value;
            if(!amt || !addr || amt > userData.balance) return alert("Invalid amount or balance");
            await db.collection('withdraws').add({ uid: auth.currentUser.uid, email: auth.currentUser.email, address: addr, amount: amt, status: 'pending', time: Date.now() });
            alert("Withdrawal requested!");
            hideM('witM');
        }

        function showM(id) { document.getElementById(id).style.display = 'flex'; }
        function hideM(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
